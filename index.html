<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>활동일지</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --muted:#596273; --line:#c9cfda; --brand:#1f5fd0; --brand-ink:#fff; --warn:#b42318; --ok:#0b6b3a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151b; --card:#1b2029; --ink:#eef1f6; --muted:#a9b2c0; --line:#3a4354; --brand:#6aa0ff; --brand-ink:#0b1220; --warn:#ff9d94; --ok:#6fdc9b; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:18px/1.6 -apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif; }
  header { padding:16px; max-width:760px; margin:0 auto; display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
  h1 { font-size:1.35rem; margin:0; }
  h2 { font-size:1.15rem; margin:0 0 12px; }
  main { max-width:760px; margin:0 auto; padding:0 16px 56px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  input, select, textarea, button { font:inherit; color:inherit; }
  input[type=text], input[type=tel], input[type=date], input[type=search], select, textarea { width:100%; padding:12px; border:2px solid var(--line); border-radius:8px; background:var(--card); }
  textarea { min-height:110px; resize:vertical; }
  button { padding:12px 18px; border-radius:8px; border:2px solid var(--line); background:var(--card); cursor:pointer; min-height:48px; }
  button.primary { background:var(--brand); color:var(--brand-ink); border-color:var(--brand); font-weight:700; }
  button:disabled { opacity:.55; cursor:not-allowed; }
  :focus-visible { outline:3px solid var(--brand); outline-offset:2px; }
  label, legend { display:block; font-weight:600; margin-bottom:6px; }
  .hint { color:var(--muted); font-size:.9rem; font-weight:400; }
  .field { margin-bottom:16px; }
  fieldset { border:2px solid var(--line); border-radius:8px; padding:10px 14px; margin:0 0 16px; }
  .check { display:flex; gap:10px; align-items:flex-start; padding:8px 0; font-weight:400; margin:0; }
  .check input { width:24px; height:24px; margin-top:3px; flex:none; }
  .banner { background:#fff4e5; color:#6b4200; border:1px solid #ffd8a8; border-radius:8px; padding:10px 12px; margin-bottom:14px; font-size:.95rem; }
  @media (prefers-color-scheme: dark) { .banner { background:#33270f; color:#ffd8a8; border-color:#5a4318; } }
  #status { min-height:1.6em; margin-bottom:10px; font-weight:600; }
  #status.err { color:var(--warn); } #status.ok { color:var(--ok); }
  .meta { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:6px; }
  .tag { font-size:.85rem; padding:2px 10px; border-radius:999px; border:1px solid var(--line); }
  .entry p { margin:8px 0 0; white-space:pre-wrap; word-break:break-word; }
  .lbl { color:var(--muted); font-size:.9rem; display:block; }
  .previews, .photos { display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
  .thumb { position:relative; }
  .thumb img, .photos img { width:140px; height:140px; object-fit:cover; border-radius:8px; border:1px solid var(--line); background:var(--bg); display:block; }
  .photos img { cursor:zoom-in; }
  .photos img.big { width:100%; height:auto; max-height:80vh; object-fit:contain; cursor:zoom-out; }
  .thumb button { margin-top:6px; width:140px; min-height:40px; padding:6px; font-size:.9rem; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .form-card { border-left:6px solid var(--brand); }
  .records { margin-top:48px; padding-top:28px; border-top:4px solid var(--brand); }
  .records h2 { font-size:1.3rem; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .badge { font-size:.9rem; font-weight:600; padding:2px 12px; border-radius:999px; background:var(--brand); color:var(--brand-ink); }
  .badge:empty { display:none; }
  .records .entry { background:var(--bg); border-style:dashed; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<header>
  <h1>활동일지</h1>
  <div class="row"><span id="who" class="hint"></span><button id="btnLogout" class="hidden">나가기</button></div>
</header>

<main>
  <div id="demoBanner" class="banner hidden" role="note">체험 모드입니다. 샘플 데이터이며 저장되지 않습니다. 체험 로그인: 홍길동 / 1234 ('혈당' 목표 있음), 김철수 / 5678 ('혈당' 목표 없음)</div>
  <div id="status" role="status" aria-live="polite"></div>

  <!-- 로그인 -->
  <section id="login" class="card" aria-labelledby="loginTitle">
    <h2 id="loginTitle">본인 확인</h2>
    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label for="inName">성명</label>
        <input id="inName" type="text" autocomplete="off" required>
      </div>
      <div class="field">
        <label for="inPhone">전화번호 뒷자리 4자리 <span class="hint">(숫자 4개)</span></label>
        <input id="inPhone" type="tel" inputmode="numeric" pattern="\d{4}" maxlength="4" autocomplete="off" required>
      </div>
      <button class="primary" type="submit" id="btnLogin">들어가기</button>
    </form>
  </section>

  <!-- 작성 + 목록 -->
  <section id="app" class="hidden">
    <div class="card form-card" aria-labelledby="addTitle">
      <h2 id="addTitle">활동 기록하기</h2>
      <form id="addForm">
        <div class="field">
          <label for="fDate">날짜</label>
          <input id="fDate" type="date" required>
        </div>
        <fieldset id="goalBox" aria-describedby="goalHint">
          <legend>참여목표 <span class="hint" id="goalHint">(해당하는 것을 모두 선택)</span></legend>
          <div id="goalList"></div>
        </fieldset>
        <div class="field">
          <label for="fContent">활동내용</label>
          <textarea id="fContent" maxlength="3000" required></textarea>
        </div>
        <div class="field">
          <label for="fFeeling">활동소감</label>
          <textarea id="fFeeling" maxlength="3000"></textarea>
        </div>
        <fieldset id="glucoseBox" class="hidden">
          <legend>혈당 기록 <span class="hint">(혈당 확인 목표를 선택했을 때, 측정한 경우에만)</span></legend>
          <div class="field">
            <label for="fGlucose">혈당 수치 (mg/dL)</label>
            <input id="fGlucose" type="text" inputmode="numeric" pattern="\d{2,3}" maxlength="3" autocomplete="off">
          </div>
          <div class="field" style="margin-bottom:0">
            <label for="fTiming">측정 시점</label>
            <select id="fTiming"></select>
          </div>
        </fieldset>
        <div class="field">
          <label for="fPhotos">사진 <span class="hint">(최대 3장)</span></label>
          <input id="fPhotos" type="file" accept="image/*" multiple>
          <div id="previews" class="previews"></div>
        </div>
        <div class="field">
          <label for="fNote">비고 <span class="hint">(선택)</span></label>
          <input id="fNote" type="text" maxlength="3000">
        </div>
        <button class="primary" type="submit" id="btnSave">저장하기</button>
      </form>
    </div>

    <section class="records" aria-labelledby="recTitle">
      <h2 id="recTitle">내 활동 기록 <span id="count" class="badge" aria-live="polite"></span></h2>
      <div class="field">
        <label for="fFilter">참여목표별 보기</label>
        <select id="fFilter"><option value="">전체</option></select>
      </div>
      <div id="list"></div>
      <div class="row"><button id="btnMore" class="hidden">더 보기</button></div>
    </section>
  </section>
</main>

<script src="config.js"></script>
<script>
(function () {
  "use strict";
  const DEMO = !window.APP_CONFIG || !window.APP_CONFIG.API_URL;
  const MAX_PHOTOS = 3, PAGE = 10, MAX_EDGE = 1280;
  const $ = (id) => document.getElementById(id);
  const MSG = {
    AUTH: "성명 또는 전화번호 뒷자리가 맞지 않습니다. 다시 확인해 주세요.",
    LOCKED: "여러 번 맞지 않아 잠시 쉬어갑니다. 약 10분 뒤에 다시 시도해 주세요.",
    BAD_REQUEST: "입력한 내용을 확인해 주세요.",
    SERVER: "일시적인 오류가 있습니다. 잠시 후 다시 시도해 주세요.",
    NETWORK: "인터넷 연결을 확인해 주세요."
  };
  let session = null;     // { name, phone4, goals }  (메모리에만 보관)
  let records = [], shown = PAGE;
  let newPhotos = [];     // { b64, url }
  const photoCache = new Map();

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
  function status(msg, kind) { const el = $("status"); el.textContent = msg || ""; el.className = kind || ""; }
  function today() { return new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 10); }

  /* ---------- 서버 호출 ---------- */
  async function call(action, payload) {
    const body = Object.assign({ action, name: session.name, phone4: session.phone4 }, payload || {});
    if (DEMO) return demo(body);
    try {
      const r = await fetch(window.APP_CONFIG.API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) });
      return await r.json();
    } catch (e) { return { ok: false, error: "NETWORK" }; }
  }

  /* ---------- 체험 모드(서버 대역) ---------- */
  const demoDB = { goals: ["집에서 간단한 요리 배우기", "식재료 장보기", "혈당 스스로 확인하기"], goals2: ["식재료 장보기", "집에서 간단한 요리 배우기"], fails: 0, photos: {},
    records: [
      { owner: "홍길동", date: "2026-10-28", goals: ["집에서 간단한 요리 배우기"], content: "이웃과 함께 두부 요리를 해 보았다.", feeling: "생각보다 어렵지 않았고 다음에는 국도 끓여 보고 싶다.", photos: [], note: "", glucose: 112, timing: "식후" },
      { owner: "홍길동", date: "2026-10-24", goals: ["식재료 장보기"], content: "동네 마트에서 식재료를 직접 골라 구입했다.", feeling: "필요한 물건을 찾는 데 시간이 걸렸지만 혼자 해냈다.", photos: [], note: "", glucose: null, timing: "" },
      { owner: "김철수", date: "2026-10-20", goals: ["식재료 장보기"], content: "마트 동행 장보기.", feeling: "", photos: [], note: "", glucose: null, timing: "" }
    ] };
  async function demo(b) {
    const nn = String(b.name).replace(/\s+/g, "");
    if (demoDB.fails >= 10) return { ok: false, error: "LOCKED" };
    const glu = nn === "홍길동" && b.phone4 === "1234", plain = nn === "김철수" && b.phone4 === "5678"; // 김철수는 혈당 항목이 없는 사람
    if (!glu && !plain) { demoDB.fails++; return { ok: false, error: "AUTH" }; }
    demoDB.fails = 0;
    const me = glu ? "홍길동" : "김철수", recs = demoDB.records.filter((r) => r.owner === me);
    if (b.action === "add") {
      if ((b.photos || []).length > 3) return { ok: false, error: "BAD_REQUEST" };
      if (b.glucose && !(b.goals || []).some((g) => g.indexOf("혈당") >= 0)) return { ok: false, error: "BAD_REQUEST" };
      const ids = (b.photos || []).map((p, i) => { const id = "demo" + Date.now() + i; demoDB.photos[id] = p.data; return id; });
      const rec = { owner: me, date: b.date, goals: b.goals, content: b.content, feeling: b.feeling || "", photos: ids, note: b.note || "", glucose: b.glucose ? Number(b.glucose) : null, timing: b.timing || "" };
      demoDB.records.unshift(rec); recs.unshift(rec);
    }
    if (b.action === "photo") return demoDB.photos[b.id] ? { ok: true, mime: "image/jpeg", data: demoDB.photos[b.id] } : { ok: false, error: "BAD_REQUEST" };
    return { ok: true, name: me, goals: glu ? demoDB.goals : demoDB.goals2, timings: ["공복", "식전", "식후"], records: recs };
  }

  /* ---------- 로그인 ---------- */
  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = $("inName").value.trim(), phone4 = $("inPhone").value.trim();
    if (!name) { status("성명을 입력해 주세요.", "err"); $("inName").focus(); return; }
    if (!/^\d{4}$/.test(phone4)) { status("전화번호 뒷자리 숫자 4개를 입력해 주세요.", "err"); $("inPhone").focus(); return; }
    $("btnLogin").disabled = true; status("확인하는 중입니다…");
    session = { name, phone4, goals: [] };
    const res = await call("login");
    $("btnLogin").disabled = false;
    if (!res.ok) { session = null; $("inPhone").value = ""; status(MSG[res.error] || MSG.SERVER, "err"); return; }
    session = { name: res.name, phone4, goals: res.goals, timings: res.timings || [] };
    $("inName").value = ""; $("inPhone").value = "";
    enterApp(res.records);
  });

  function enterApp(recs) {
    $("login").classList.add("hidden"); $("app").classList.remove("hidden"); $("btnLogout").classList.remove("hidden");
    $("who").textContent = session.name + " 님";
    status("");
    renderGoals(); renderGlucose(); resetForm(); setRecords(recs);
    $("addTitle").setAttribute("tabindex", "-1"); $("addTitle").focus();
  }
  $("btnLogout").addEventListener("click", () => {
    session = null; records = []; clearPhotoUI();
    photoCache.forEach((u) => URL.revokeObjectURL(u)); photoCache.clear();
    $("list").innerHTML = ""; $("app").classList.add("hidden"); $("btnLogout").classList.add("hidden");
    $("login").classList.remove("hidden"); $("who").textContent = "";
    status("나왔습니다.", "ok"); $("inName").focus();
  });

  /* ---------- 작성 폼 ---------- */
  function renderGoals() {
    const box = $("goalList");
    if (!session.goals.length) { box.innerHTML = '<p class="hint">등록된 참여목표가 없습니다. 담당자에게 문의해 주세요.</p>'; return; }
    box.innerHTML = session.goals.map((g, i) =>
      '<label class="check" for="goal' + i + '"><input type="checkbox" id="goal' + i + '" name="goal" value="' + esc(g) + '"><span>' + esc(g) + "</span></label>").join("");
  }
  // '혈당'이 들어간 참여목표를 선택했을 때만 혈당 입력칸을 보여 줍니다
  function glucoseOn() {
    return Array.from(document.querySelectorAll('input[name="goal"]:checked')).some((c) => c.value.indexOf("혈당") >= 0);
  }
  function renderGlucose() {
    $("fTiming").innerHTML = session.timings.map((t) => "<option>" + esc(t) + "</option>").join("");
    const on = glucoseOn();
    $("glucoseBox").classList.toggle("hidden", !on);
    if (!on) $("fGlucose").value = "";
  }
  $("goalList").addEventListener("change", renderGlucose);
  function resetForm() {
    $("fGlucose").value = "";
    $("fDate").value = today(); $("fContent").value = ""; $("fFeeling").value = ""; $("fNote").value = "";
    document.querySelectorAll('input[name="goal"]').forEach((c) => (c.checked = false));
    renderGlucose(); clearPhotoUI();
  }

  /* 사진: 브라우저에서 크기를 줄여서 올립니다 */
  async function shrink(file) {
    const bmp = await createImageBitmap(file);
    const s = Math.min(1, MAX_EDGE / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    if (bmp.close) bmp.close();
    const url = c.toDataURL("image/jpeg", 0.85);
    return { b64: url.split(",")[1], url };
  }
  $("fPhotos").addEventListener("change", async (e) => {
    const files = Array.from(e.target.files || []); e.target.value = "";
    for (const f of files) {
      if (newPhotos.length >= MAX_PHOTOS) { status("사진은 최대 " + MAX_PHOTOS + "장까지 올릴 수 있습니다.", "err"); break; }
      try { newPhotos.push(await shrink(f)); }
      catch (err) { status("이 사진은 사용할 수 없습니다. 다른 사진을 선택해 주세요.", "err"); }
    }
    renderPreviews();
  });
  function renderPreviews() {
    $("previews").innerHTML = newPhotos.map((p, i) =>
      '<div class="thumb"><img src="' + p.url + '" alt="첨부할 사진 ' + (i + 1) + '"><button type="button" data-i="' + i + '" aria-label="사진 ' + (i + 1) + ' 삭제">삭제</button></div>').join("");
  }
  $("previews").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-i]"); if (!b) return;
    newPhotos.splice(Number(b.dataset.i), 1); renderPreviews(); $("fPhotos").focus();
  });
  function clearPhotoUI() { newPhotos = []; renderPreviews(); }

  $("addForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const goals = Array.from(document.querySelectorAll('input[name="goal"]:checked')).map((c) => c.value);
    if (!goals.length) { status("참여목표를 하나 이상 선택해 주세요.", "err"); const f = document.querySelector('input[name="goal"]'); if (f) f.focus(); return; }
    if (!$("fContent").value.trim()) { status("활동내용을 적어 주세요.", "err"); $("fContent").focus(); return; }
    let glucose = "";
    if (glucoseOn()) {
      glucose = $("fGlucose").value.trim();
      if (glucose && (!/^\d{2,3}$/.test(glucose) || +glucose < 20 || +glucose > 600)) { status("혈당 수치는 20에서 600 사이 숫자로 적어 주세요.", "err"); $("fGlucose").focus(); return; }
    }
    $("btnSave").disabled = true; status("저장하는 중입니다. 사진이 있으면 조금 걸릴 수 있어요…");
    const res = await call("add", {
      date: $("fDate").value, goals, content: $("fContent").value, feeling: $("fFeeling").value, note: $("fNote").value,
      glucose, timing: glucose ? $("fTiming").value : "",
      photos: newPhotos.map((p) => ({ data: p.b64 }))
    });
    $("btnSave").disabled = false;
    if (!res.ok) { status(MSG[res.error] || MSG.SERVER, "err"); return; }
    resetForm(); setRecords(res.records); status("저장했습니다.", "ok");
    $("list").scrollIntoView({ behavior: "smooth", block: "start" });
  });

  /* ---------- 목록 ---------- */
  function setRecords(recs) {
    records = recs || []; shown = PAGE;
    const goals = [...new Set(records.flatMap((r) => r.goals))];
    const cur = $("fFilter").value;
    $("fFilter").innerHTML = '<option value="">전체</option>' + goals.map((g) => "<option>" + esc(g) + "</option>").join("");
    $("fFilter").value = goals.includes(cur) ? cur : "";
    renderList();
  }
  $("fFilter").addEventListener("change", () => { shown = PAGE; renderList(); });
  $("btnMore").addEventListener("click", () => { shown += PAGE; renderList(); });

  function renderList() {
    const f = $("fFilter").value;
    const all = records.filter((r) => !f || r.goals.includes(f));
    const part = all.slice(0, shown);
    $("count").textContent = all.length ? all.length + "건" : "";
    $("btnMore").classList.toggle("hidden", all.length <= shown);
    $("list").innerHTML = part.length ? part.map((r) =>
      '<article class="card entry"><div class="meta"><strong>' + esc(r.date) + "</strong>" +
      r.goals.map((g) => '<span class="tag">' + esc(g) + "</span>").join("") + "</div>" +
      '<p><span class="lbl">활동내용</span>' + esc(r.content) + "</p>" +
      (r.feeling ? '<p><span class="lbl">활동소감</span>' + esc(r.feeling) + "</p>" : "") +
      (r.glucose != null ? '<p><span class="lbl">혈당</span>' + esc(r.glucose) + " mg/dL" + (r.timing ? " (" + esc(r.timing) + ")" : "") + "</p>" : "") +
      (r.note ? '<p><span class="lbl">비고</span>' + esc(r.note) + "</p>" : "") +
      (r.photos.length ? '<div class="photos">' + r.photos.map((id, i) => '<img data-id="' + esc(id) + '" alt="' + esc(r.date) + ' 활동 사진 ' + (i + 1) + '" tabindex="0">').join("") + "</div>" : "") +
      "</article>"
    ).join("") : '<div class="card hint">아직 기록이 없습니다.</div>';
    loadPhotos();
  }
  async function loadPhotos() {
    const imgs = Array.from(document.querySelectorAll("#list img[data-id]"));
    for (const img of imgs) {
      const id = img.dataset.id;
      if (!photoCache.has(id)) {
        if (!session) return;
        const res = await call("photo", { id });
        if (!res.ok) { img.alt += " (불러오지 못함)"; continue; }
        const bytes = Uint8Array.from(atob(res.data), (c) => c.charCodeAt(0));
        photoCache.set(id, URL.createObjectURL(new Blob([bytes], { type: res.mime })));
      }
      img.src = photoCache.get(id);
    }
  }
  $("list").addEventListener("click", (e) => { const i = e.target.closest("img[data-id]"); if (i && i.src) i.classList.toggle("big"); });
  $("list").addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && e.target.matches("img[data-id]")) { e.preventDefault(); e.target.classList.toggle("big"); } });

  if (DEMO) $("demoBanner").classList.remove("hidden");
})();
</script>
</body>
</html>
